<!doctype html>
<!--
  ESSAI JETABLE : à retirer après l'essai (avec essai-google.js, .css,
  essai-manifest.webmanifest et essaiGoogle.test.js). Cette page n'est liée
  depuis nulle part dans l'app. Elle sert à voir où atterrit le retour de
  l'écran d'accord Google quand elle est installée sur l'écran d'accueil.
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Essai Google</title>
  <link rel="stylesheet" href="essai-google.css">
  <link rel="manifest" href="essai-manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Essai Google">
</head>
<body>
  <main>
    <h1>Essai Google</h1>
    <p id="essai-numero">Essai n° 1</p>

    <section id="accueil">
      <p>Essai jetable : cette page envoie vers l'écran d'accord de Google, puis affiche ce qui s'est passé au retour. Rien n'est envoyé nulle part.</p>
      <button id="lancer" type="button">Lancer l'essai</button>
    </section>

    <section id="resultat" hidden>
      <h2>Résultat</h2>
      <ul id="lignes"></ul>
      <button id="recommencer" type="button">Recommencer</button>
    </section>
  </main>
  <script type="module" src="essai-google.js"></script>
</body>
</html>
