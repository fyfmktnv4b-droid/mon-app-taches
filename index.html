<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mes Tâches</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#8FA37E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <section id="auth">
    <h1>Mes Tâches</h1>
    <form id="auth-form">
      <input type="email" id="auth-email" placeholder="Email" required>
      <input type="password" id="auth-password" placeholder="Mot de passe" required>
      <button type="submit" id="auth-signin">Se connecter</button>
      <button type="button" id="auth-signup">Créer un compte</button>
    </form>
    <p id="auth-error"></p>
  </section>

  <section id="welcome" hidden>
    <p id="welcome-day"></p>
    <div id="welcome-textblock">
      <blockquote id="welcome-quote"></blockquote>
      <p id="welcome-verse"></p>
    </div>
    <div id="welcome-scene-wrap">
      <img id="welcome-scene" alt="">
      <div id="welcome-scene-fallback" class="scene-fallback" hidden></div>
    </div>
    <button id="welcome-continue">Commencer</button>
  </section>

  <section id="routine" hidden>
    <h2>Routine du matin</h2>
    <div id="routine-checks"></div>
    <button id="routine-continue" disabled>Continuer</button>
    <button id="routine-skip" type="button">Passer pour aujourd'hui</button>
  </section>

  <section id="app" hidden>
    <header>
      <div class="header-text">
        <p id="header-date"></p>
        <h1 id="header-title">Aujourd'hui</h1>
      </div>
      <button id="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h9"/></svg>
      </button>
    </header>
    <div id="menu-scrim" hidden></div>
    <div id="menu-panel" hidden>
      <div class="menu-grid">
        <button id="nav-history" type="button" class="menu-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg><span>Historique</span></button>
        <button id="nav-settings" type="button" class="menu-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Réglages</span></button>
        <button id="open-routine" type="button" class="menu-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18"/><path d="M6.5 19a5.5 5.5 0 0 1 11 0"/><path d="M12 6V4M4.9 9.9 3.5 8.5M19.1 9.9l1.4-1.4"/></svg><span>Ma routine</span></button>
        <button id="export-json" type="button" class="menu-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5"/><path d="M5 20h14"/></svg><span>Sauvegarder mes tâches</span></button>
      </div>
      <button id="sign-out" type="button" class="menu-account"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9"/></svg><span>Compte · Se déconnecter</span></button>
    </div>
    <p id="app-error"></p>
    <main id="main-view"></main>
    <form id="capture-form">
      <textarea id="capture-input" rows="1" placeholder="Une tâche par ligne..." aria-label="Nouvelles tâches"></textarea>
      <button type="submit" id="capture-submit" aria-label="Ajouter">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>
    <div id="task-menu-scrim" hidden></div>
    <div id="task-menu" role="menu" hidden>
      <button type="button" id="task-undo" role="menuitem">Annuler la validation</button>
      <button type="button" id="task-remove" role="menuitem">Supprimer</button>
    </div>
    <div id="reminder-sheet" hidden>
      <div id="reminder-scrim"></div>
      <div id="reminder-card" role="dialog" aria-label="Heure du rappel">
        <h2>Heure du rappel</h2>
        <input type="time" id="reminder-input">
        <div class="reminder-actions">
          <button type="button" id="reminder-cancel" class="sheet-secondary">Annuler</button>
          <button type="button" id="reminder-ok" aria-label="Valider">Valider ✓</button>
        </div>
        <button type="button" id="reminder-remove" class="sheet-danger" hidden>Supprimer le rappel</button>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
