<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Tâches</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#8FA37E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <section id="auth">
    <h1>Mes Tâches</h1>
    <form id="auth-form">
      <input type="email" id="auth-email" placeholder="Email" required>
      <input type="password" id="auth-password" placeholder="Mot de passe" required>
      <button type="submit" id="auth-signin">Se connecter</button>
      <button type="button" id="auth-signup">Créer un compte</button>
    </form>
    <p id="auth-error"></p>
  </section>

  <section id="welcome" hidden>
    <p id="welcome-day"></p>
    <div id="welcome-textblock">
      <blockquote id="welcome-quote"></blockquote>
      <p id="welcome-verse"></p>
    </div>
    <div id="welcome-scene-wrap">
      <img id="welcome-scene" alt="">
      <div id="welcome-scene-fallback" class="scene-fallback" hidden></div>
    </div>
    <button id="welcome-continue">Commencer</button>
  </section>

  <section id="app" hidden>
    <header>
      <h1>Mes Tâches</h1>
      <div class="header-actions">
        <nav>
          <button id="nav-main" data-active="true">Aujourd'hui</button>
          <button id="nav-history" data-active="false">Historique</button>
          <button id="nav-settings" data-active="false">Réglages</button>
        </nav>
        <button id="sign-out">Déconnexion</button>
        <button id="export-json">Exporter (JSON)</button>
      </div>
    </header>
    <p id="app-error"></p>
    <main id="main-view"></main>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
